name: Terraform Validate & Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  validate:
    name: Terraform Validate & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: "1.16.1"

      - name: Show Terraform Version
        run: terraform --version

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef #v6.3.1
        with:
          tflint_version: latest

      - name: Show TFLint Version
        run: tflint --version

      - name: TFLint Init
        run: tflint --init --config=.tflint.hcl

      - name: Run TFLint
        continue-on-error: true
        run: |
          tflint --config=.tflint.hcl --format json . > tflint-report.json || true
          tflint --config=.tflint.hcl

      - name: Run Checkov Security Scan
        continue-on-error: true
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf #v12.1347.0
        with:
          config_file: .checkov.yml
          soft_fail: true

      - name: Upload Security & Lint Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-and-quality-reports
          path: |
            tflint-report.json
          if-no-files-found: ignore
