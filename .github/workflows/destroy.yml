name: Terraform Destroy (Protected)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
      confirmation:
        description: 'Type "DESTROY" to confirm destruction'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Check Confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DESTROY" ]; then
            echo "Destruction was not explicitly confirmed with 'DESTROY'. Aborting."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: "1.16.1"

      - name: Configure AWS Credentials
        if: ${{ vars.AWS_DEPLOYMENT_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c #6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ARN }}
          aws-region: ${{ vars.AWS_DEPLOYMENT_REGION || 'us-east-1' }}

      - name: Fetch Secrets from AWS Secrets Manager
        if: ${{ vars.SECRETS_ARN_TERRAFORM != '' }}
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 #v3.0.1
        with:
          secret-ids: |
            ${{ vars.SECRETS_ARN_TERRAFORM }}
          parse-json-secrets: true

      - name: Set Terraform Environment Variables
        run: |
          echo "TF_VAR_environment=${{ github.event.inputs.environment }}" >> "$GITHUB_ENV"
          if [ -n "${{ env.TERRAFORM_ALERT_EMAIL }}" ]; then
            echo "TF_VAR_alert_email=${{ env.TERRAFORM_ALERT_EMAIL }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ env.TERRAFORM_GRAFANA_ADMIN_PASSWORD }}" ]; then
            echo "TF_VAR_grafana_admin_password=${{ env.TERRAFORM_GRAFANA_ADMIN_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ env.TERRAFORM_OWNER_EMAIL }}" ]; then
            echo "TF_VAR_owner_email=${{ env.TERRAFORM_OWNER_EMAIL }}" >> "$GITHUB_ENV"
          fi

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
