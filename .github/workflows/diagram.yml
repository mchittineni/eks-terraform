name: Generate Architecture Diagram

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to plan and diagram'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      commit_diagram:
        description: 'Commit updated docs/architecture.svg back to repository'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: write

jobs:
  diagram:
    name: Generate Architecture Diagram
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js (Node 22+)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: "1.16.1"

      - name: Configure AWS Credentials
        if: ${{ vars.AWS_DEPLOYMENT_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c #6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ARN }}
          aws-region: ${{ vars.AWS_DEPLOYMENT_REGION || 'us-east-1' }}

      - name: Fetch Secrets from AWS Secrets Manager
        if: ${{ vars.SECRETS_ARN_TERRAFORM != '' }}
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 #v3.0.1
        with:
          secret-ids: |
            ${{ vars.SECRETS_ARN_TERRAFORM }}
          parse-json-secrets: true

      - name: Set Terraform Environment Variables
        run: |
          echo "TF_VAR_environment=${{ github.event.inputs.environment }}" >> "$GITHUB_ENV"
          if [ -n "${{ env.TERRAFORM_ALERT_EMAIL }}" ]; then
            echo "TF_VAR_alert_email=${{ env.TERRAFORM_ALERT_EMAIL }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ env.TERRAFORM_GRAFANA_ADMIN_PASSWORD }}" ]; then
            echo "TF_VAR_grafana_admin_password=${{ env.TERRAFORM_GRAFANA_ADMIN_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ env.TERRAFORM_OWNER_EMAIL }}" ]; then
            echo "TF_VAR_owner_email=${{ env.TERRAFORM_OWNER_EMAIL }}" >> "$GITHUB_ENV"
          fi

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Render Cloud Architecture Diagram (tf-arch-diagram-generator)
        run: |
          echo "Generating architecture diagram with mchittineni/tf-arch-diagram-generator..."
          npx -y tf-arch-diagram-generator render plan.json \
            --out docs/architecture.svg \
            --title "AWS EKS Architecture (${{ github.event.inputs.environment }})"
          npx -y tf-arch-diagram-generator inspect plan.json --json > plan-summary.json
          echo "✓ Diagram generated successfully at docs/architecture.svg"

      - name: Upload Diagram & Plan Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-diagram-${{ github.event.inputs.environment }}
          path: |
            docs/architecture.svg
            plan.json
            plan-summary.json

      - name: Commit and Push Diagram (if enabled)
        if: ${{ github.event.inputs.commit_diagram == 'true' || github.event.inputs.commit_diagram == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q 'docs/architecture.svg'; then
            git add docs/architecture.svg
            git commit -m "chore(diagram): update architecture diagram via tf-arch-diagram-generator [skip ci]"
            git push
            echo "✓ Pushed updated docs/architecture.svg to repository"
          else
            echo "No changes to docs/architecture.svg detected."
          fi
